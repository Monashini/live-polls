# Render Blueprint.
#
# Pointing Render at this file configures the service declaratively instead of
# clicking through a form, which means the deployment is reviewable in the repo
# and reproducible if it ever has to be rebuilt.
#
# Secrets use `sync: false`. That tells Render "this variable exists, prompt me
# for its value, and do not read it from the repo" -- so the blueprint can be
# public while the values never are.

services:
  - type: web
    name: livepolls-api
    runtime: docker
    plan: free

    # Singapore is the closest Render region to India, which keeps the round
    # trip to the browser short. MongoDB Atlas and Upstash should ideally be in
    # the same region; a cross-continent hop on every query is the easiest
    # latency win to give away by accident.
    region: singapore

    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

    # Render polls this. /healthz pings MongoDB and Redis for real, so a
    # container that booted but cannot reach its databases is correctly marked
    # unhealthy instead of quietly serving errors.
    healthCheckPath: /healthz

    envVars:
      - key: APP_ENV
        value: production

      # Frontend and API are on different domains (vercel.app vs onrender.com),
      # which makes every vote a cross-site request. A SameSite=Lax cookie is
      # not sent cross-site, so without these two the anonymous voter cookie is
      # never returned and duplicate-vote prevention silently stops working.
      # Browsers also reject SameSite=None without Secure, so both are required
      # together -- config.go refuses to start if only one is set.
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_SECURE
        value: "true"

      # Render terminates TLS at its own proxy and forwards the real client in
      # X-Forwarded-For. Gin only believes that header when the immediate peer
      # is in this list, and it returns the PROXY's address otherwise -- which
      # would put every visitor on the internet into one rate-limit bucket and
      # start refusing votes site-wide after 30.
      #
      # This is 0.0.0.0/0 rather than a private range on purpose. Render's edge
      # sits on public cloud addresses, not 10.0.0.0/8, so a private-range list
      # would silently produce exactly that failure. Weigh the two failure
      # modes: too strict is a guaranteed outage for everyone; too permissive
      # lets someone forge X-Forwarded-For to dodge their own rate limit.
      #
      # The forgery is acceptable here because this limit is load protection,
      # not an authorisation control. What actually stops double voting is the
      # unique index on (pollId, voterKey), which is keyed on a cookie and is
      # not affected by any of this. The stored IP hash is for abuse analysis
      # only. If this app ever gated something that mattered on client IP, this
      # would need Render's real egress range instead.
      - key: TRUSTED_PROXIES
        value: 0.0.0.0/0

      - key: MONGODB_DATABASE
        value: livepolls
      - key: JWT_TTL
        value: 24h
      - key: REDIS_COUNTS_TTL
        value: 24h
      - key: VOTE_RATE_LIMIT
        value: "30"
      - key: VOTE_RATE_WINDOW
        value: 5m

      # --- set these in the Render dashboard, never here ------------------
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: IP_HASH_SALT
        sync: false

      # The exact Vercel origin, no trailing slash. Unknown until the frontend
      # is deployed, so it is filled in afterwards.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
